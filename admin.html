<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenMux 控制台 - 用户口令与权限管理</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <!-- 顶部导航 -->
  <header class="admin-header">
    <div class="nav-container">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
        </svg>
        <span>ZenMux</span>
        <span class="badge-admin">控制台</span>
      </div>
      <div class="nav-actions">
        <a href="./index.html" class="btn-link">← 返回聊天</a>
        <button id="logout-btn" class="btn-secondary hidden">退出登录</button>
      </div>
    </div>
  </header>

  <!-- 主容器 -->
  <main class="admin-main">

    <!-- 1. 登录门禁视窗 -->
    <div id="login-view" class="login-wrapper">
      <div class="login-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="login-title">管理员身份认证</h1>
      <p class="login-desc">请输入环境变量中配置的 ADMIN_TOKEN 以解锁用户口令与权限管理系统</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="admin-token-input">管理口令 (ADMIN_TOKEN)</label>
          <input type="password" id="admin-token-input" class="form-input" placeholder="输入管理口令..." required
            autocomplete="current-password">
        </div>
        <button type="submit" id="login-submit-btn" class="btn-primary">验证并登录</button>
      </form>
    </div>

    <!-- 2. 仪表盘视窗 -->
    <div id="dashboard-view" class="dashboard-grid hidden">

      <!-- 卡片：新建用户 -->
      <section class="panel-card">
        <div class="panel-header">
          <h2 class="panel-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            分配新用户访问口令
          </h2>
        </div>
        <form id="create-user-form" class="create-form">
          <input type="text" id="user-name-input" class="form-input" placeholder="输入用户备注名称" required maxlength="50">
          <button type="submit" id="create-user-btn" class="btn-primary">生成访问口令</button>
        </form>

        <!-- 新生成口令高亮通知栏 -->
        <div id="new-token-callout" class="new-token-banner hidden">
          <div class="new-token-meta">
            <span class="new-token-label">新生成访问口令已写入 EdgeOne KV：</span>
            <span id="new-token-display" class="new-token-val">--------</span>
          </div>
          <button type="button" id="copy-new-token-btn" class="btn-secondary">一键复制口令</button>
        </div>
      </section>

      <!-- 卡片：用户列表 -->
      <section class="panel-card">
        <div class="panel-header">
          <h2 class="panel-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            用户与口令目录
            <span id="user-count-badge" class="badge-admin">0 个用户</span>
          </h2>
          <button type="button" id="refresh-btn" class="btn-secondary">刷新数据</button>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>用户名称</th>
                <th>访问口令 (Token)</th>
                <th>状态</th>
                <th>创建时间</th>
                <th style="text-align: right;">操作</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <tr>
                <td colspan="5" class="empty-placeholder">正在同步 EdgeOne KV 数据...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </div>

  </main>

  <!-- 编辑用户与口令模态弹窗 -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">编辑用户与访问口令</h3>
        <button type="button" id="edit-modal-close" class="modal-close-btn" title="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="edit-user-form">
        <input type="hidden" id="edit-user-orig-token">
        
        <div class="form-group">
          <label class="form-label" for="edit-user-name">用户备注名称</label>
          <input type="text" id="edit-user-name" class="form-input" required maxlength="50" placeholder="例如: 研发组-小王">
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-user-token">访问口令 (Token)</label>
          <div class="input-with-action">
            <input type="text" id="edit-user-token" class="form-input" required minlength="3" maxlength="64" style="font-family: var(--font-mono); letter-spacing: 1px;" autocomplete="off" spellcheck="false">
            <button type="button" id="edit-user-regen-btn" class="btn-secondary" style="white-space: nowrap;">随机生成</button>
          </div>
          <div class="form-hint">支持 3~64 位字符（仅限字母、数字、下划线及连字符）。修改口令将迁移 KV 记录并立即使旧口令失效。</div>
        </div>

        <div class="modal-footer">
          <button type="button" id="edit-modal-cancel" class="btn-secondary">取消</button>
          <button type="submit" id="edit-modal-submit" class="btn-primary" style="width: auto;">保存更改</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="js/admin.js"></script>
</body>

</html>
