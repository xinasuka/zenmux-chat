    <select id="model" title="选择模型" data-page-node-id="oPqyzivdChjN6iLYo3d9aC"><option value="" data-page-node-id="w6hpDhMfkA5qwoyW2te1Sc">载入模型中…</option></select>

      <option value="" data-page-node-id="qF9tqF0DJTIS6GdDDYouwN">推理 默认</option>
      <option value="minimal" data-page-node-id="Ljwk1WxkRVNeWwKlK83Sn9">推理 最低</option>
      <option value="low" data-page-node-id="ctmvOc5ls1MSYrDkD4Deor">推理 低</option>
      <option value="medium" data-page-node-id="qOwJelW5GOKsGMSGUBUW6G">推理 中</option>
      <option value="high" data-page-node-id="Z908yTzxkFHEHwByZulPkF">推理 高</option>
      <option value="off" data-page-node-id="cllAylE3b7XDBoJmiifFdJ">推理 关闭</option>
    </select>
    <select id="search-depth" class="mini-sel" title="联网搜索检索深度：精炼、标准、深度或全面">
      <option value="standard">搜索 标准</option>
      <option value="quick">搜索 精炼</option>
      <option value="deep">搜索 深度</option>
      <option value="pro">搜索 全面</option>

      <option value="10" data-page-node-id="25UPVGiBiDIuEPYN6fs3wS">上下文 10</option>

      <option value="40" data-page-node-id="PNHjQJubaEeJyznuZM5GEl">上下文 40</option>

        </svg>

      <textarea id="input" rows="1" placeholder="发消息或粘贴/拖拽文件、图片，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="stop" title="停止" data-page-node-id="mPg8sygomFKpxexZkzYZK0">■</button>
      <button id="send" title="发送" data-page-node-id="DiBFl6NPkhFZqRePnLQIVR">

    </div>
  </div>
</div>

<div id="drop-overlay" class="drop-overlay">
  <div class="drop-hint">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="17 8 12 3 7 8"></polyline>
      <line x1="12" y1="3" x2="12" y2="15"></line>
    </svg>

  </div>
</div>

<div id="lightbox" class="lightbox hide">

  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="预览大图">
  </div>
</div>

<div id="gate" data-page-node-id="3RnzGpSr4STVNxFOqkxUDl">

    <button id="gate-go" data-page-node-id="xy5SJwKqNjMdJkvUpF7LVQ">进入</button>
