<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZenMux Chat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<aside id="sidebar">
  <header><button class="btn" id="new-chat">＋　新建对话</button></header>
  <div id="conv-list"></div>
  <footer>会话仅存于本机浏览器</footer>
</aside>

<div id="main">
  <div id="topbar">
    <button id="burger">☰</button>
    <select id="model" title="选择模型"><option value="">载入模型中…</option></select>
    <select id="effort" class="mini-sel" title="推理强度：仅对支持推理的模型生效">
      <option value="">推理 默认</option>
      <option value="minimal">推理 最低</option>
      <option value="low">推理 低</option>
      <option value="medium">推理 中</option>
      <option value="high">推理 高</option>
      <option value="off">推理 关闭</option>
    </select>
    <select id="ctx" class="mini-sel" title="每次请求携带多少条历史消息">
      <option value="10">上下文 10</option>
      <option value="20">上下文 20</option>
      <option value="40">上下文 40</option>
      <option value="0">上下文 全部</option>
    </select>
    <div class="spacer"></div>
    <button class="icon-btn" id="logout">退出</button>
  </div>
  <div id="thread"><div id="thread-inner"></div></div>
  <div id="composer-wrap">
    <div id="composer">
      <textarea id="input" rows="1" placeholder="发消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="stop" title="停止">■</button>
      <button id="send" title="发送">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 8l12-6-4.5 6L14 14 2 8z"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="gate">
  <div id="gate-box">
    <h2>访问口令</h2>
    <p>服务端若已配置 ACCESS_TOKEN，此处填对应值；未配置则留空直接进入。</p>
    <input id="gate-input" type="password" autocomplete="current-password" placeholder="口令">
    <button id="gate-go">进入</button>
    <div id="gate-err"></div>
  </div>
</div>

<div id="toast"></div>

<script src="app.js" defer></script>
</body>
</html>
